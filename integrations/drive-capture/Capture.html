<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <style>
    :root { font: 16px/1.5 system-ui,sans-serif; color: #edf2ff; background: #101728; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 18px; }
    main { max-width: 480px; margin: auto; }
    h1 { font-size: 1.6rem; margin: 0 0 24px; }
    label { display: block; margin: 18px 0 6px; }
    input,select,button { font: inherit; width: 100%; min-height: 48px; border-radius: 10px; padding: 12px; }
    input,select { border: 1px solid #67728b; background: #192338; color: inherit; }
    button { margin-top: 24px; border: 0; background: #acd4ff; color: #10243b; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    p { color: #c4cfe3; } a { color: #acd4ff; } small { font-size: .875rem; color: #c4cfe3; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body><main>
  <h1>Save to Archive</h1>
  <form id="capture">
    <label for="url">Link</label>
    <input id="url" name="url" type="url" required maxlength="8192" value="<?= sharedUrl ?>" placeholder="https://…">
    <label for="folderId">Folder</label>
    <select id="folderId" name="folderId" required>
      <? for (const folder of folders) { ?>
        <? if (folder.id === suggested) { ?>
          <option value="<?= folder.id ?>" selected><?= folder.name ?> — suggested</option>
        <? } else { ?>
          <option value="<?= folder.id ?>"><?= folder.name ?></option>
        <? } ?>
      <? } ?>
    </select>
    <small>Keep the suggestion or choose another folder.</small>
    <label for="title">Title <small>(optional)</small></label>
    <input id="title" name="title" maxlength="200" placeholder="A name you’ll recognize">
    <label for="tags">Tags <small>(optional, separated by commas)</small></label>
    <input id="tags" name="tags" maxlength="2430" placeholder="philosophy, watch later">
    <button id="save" type="submit">Save link</button>
  </form>
  <p id="status" role="status" aria-live="polite">Saves the link, not a copy of the page or video.</p>
  <a id="saved" hidden rel="noopener" target="_blank">Open saved link in Drive</a>
  <script>
    const form = document.getElementById('capture');
    const button = document.getElementById('save');
    const status = document.getElementById('status');
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = 'Saving…';
      status.textContent = 'Saving your link…';
      document.getElementById('saved').hidden = true;
      const input = Object.fromEntries(new FormData(form).entries());
      google.script.run.withSuccessHandler(function(result) {
        status.textContent = result.duplicate
          ? 'Already saved in ' + result.folder + '. Your existing title and tags were kept.'
          : 'Link saved in ' + result.folder + '.';
        const saved = document.getElementById('saved');
        saved.href = result.fileUrl;
        saved.hidden = false;
        button.textContent = 'Save link';
        button.disabled = false;
      }).withFailureHandler(function(error) {
        status.textContent = 'Could not save: ' + error.message;
        button.textContent = 'Try again';
        button.disabled = false;
      }).saveBookmark(input);
    });
  </script>
</main></body></html>
